name: Services

on:
  pull_request:
    branches: [ 'main' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.15.1
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm test

